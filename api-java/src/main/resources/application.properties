spring.application.name=regex-tester-api-java

# PORT is what Azure App Service's Java SE runtime sets; 5300 is the next free local dev port
# after api-dotnet (5000), api-nodejs (5100) and api-python (5200).
server.port=${PORT:5300}

# The 5-second HTTP request timeout. POST /api/regex returns a Callable, so Spring MVC applies this
# to it and raises AsyncRequestTimeoutException on expiry; ApiExceptionHandler converts that into
# HTTP 200 with an `error`-populated body, never 408 and never Spring's default 503.
spring.mvc.async.request-timeout=5000

# Contract §2: every backend serves the spec here and an interactive explorer there.
springdoc.api-docs.path=/openapi/v1.json
springdoc.swagger-ui.path=/scalar/v1
springdoc.swagger-ui.url=/openapi/v1.json

# Never omit null properties: the contract requires every response field to be emitted, and
# `matches` to be [] rather than null. Jackson's default is to include them, but setting this
# explicitly stops a future "tidy-up" from silently breaking every client.
spring.jackson.default-property-inclusion=always

# Tomcat rejects an oversized body itself before MaxBodySizeFilter could produce the contract's
# 413 ProblemDetails, so keep its own limit well clear of the 8192-byte contract limit.
server.tomcat.max-http-form-post-size=2MB
server.max-http-request-header-size=16KB
