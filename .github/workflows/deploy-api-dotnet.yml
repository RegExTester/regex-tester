name: Deploy api-dotnet to Azure

on:
  push:
    branches: [main]
    paths:
      - 'api-dotnet/**'
      - '.github/workflows/deploy-api-dotnet.yml'
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: regex-tester-api-dotnet
  DOTNET_VERSION: '10.0.x'

jobs:
  # Gate: the full four-engine contract suite must pass for this exact commit before anything is
  # deployed. No secrets are passed — the suite needs none, and the Azure credentials must not be
  # exposed to it.
  test:
    uses: ./.github/workflows/contract-tests.yml

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-dotnet

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Publish
        run: dotnet publish --configuration Release --no-build --output ./publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: api-dotnet/publish
