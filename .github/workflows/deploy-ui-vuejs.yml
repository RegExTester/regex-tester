name: Deploy ui-vuejs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'ui-vuejs/**'
      - '.github/workflows/deploy-ui-vuejs.yml'
  workflow_dispatch:

env:
  NODE_VERSION: '22.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui-vuejs

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ui-vuejs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build for production
        run: npm run build-prod

      - name: Copy index.html to 404.html for SPA routing
        run: cp dist/index.html dist/404.html

      - name: Add .nojekyll
        run: touch dist/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          external_repository: RegExTester/regextester.github.io
          publish_branch: master
          publish_dir: ui-vuejs/dist
          commit_message: 'deploy: update from regex-tester mono repo'
