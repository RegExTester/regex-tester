name: Contract tests

on:
  push:
    branches: [main]
  pull_request:
  # Callable by the five deploy workflows so a deployment can depend on a green suite for the exact
  # commit being deployed. Deliberately a reusable workflow rather than `workflow_run` on the deploy
  # side: `workflow_run` cannot use `paths` filters, and it checks out the default-branch tip rather
  # than the commit that was tested unless head_sha is passed explicitly — which would let untested
  # code deploy. Calling this keeps the test and deploy jobs in one run on one SHA.
  # This workflow needs no secrets; callers must not pass any.
  workflow_call:

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: dotnet
            port: 5000
          - engine: nodejs
            port: 5100
          - engine: python
            port: 5200
          - engine: java
            port: 5300

    steps:
      - uses: actions/checkout@v4

      # Always needed: the contract suite itself (tests/contract) runs on vitest/Node.js,
      # regardless of which backend is under test.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Setup .NET
        if: matrix.engine == 'dotnet'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python
        if: matrix.engine == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup Java
        if: matrix.engine == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '21'
          cache: maven

      - name: Start api-dotnet
        if: matrix.engine == 'dotnet'
        working-directory: api-dotnet
        run: |
          dotnet restore
          ASPNETCORE_URLS=http://localhost:5000 ASPNETCORE_ENVIRONMENT=Development \
            nohup dotnet run --no-launch-profile > dotnet.log 2>&1 &

      - name: Start api-nodejs
        if: matrix.engine == 'nodejs'
        working-directory: api-nodejs
        run: |
          npm ci
          PORT=5100 nohup npm start > nodejs.log 2>&1 &

      - name: Start api-python
        if: matrix.engine == 'python'
        working-directory: api-python
        run: |
          pip install -r requirements.txt
          PORT=5200 nohup python -m uvicorn src.main:app --host 0.0.0.0 --port 5200 > python.log 2>&1 &

      - name: Start api-java
        if: matrix.engine == 'java'
        working-directory: api-java
        run: |
          mvn -B -ntp package -DskipTests
          PORT=5300 nohup java -jar target/app.jar > java.log 2>&1 &

      - name: Wait for backend to become ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf "http://localhost:${{ matrix.port }}/api/capabilities" > /dev/null; then
              echo "Backend on port ${{ matrix.port }} is ready."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Backend on port ${{ matrix.port }} did not become ready in time."
          exit 1

      - name: Install contract suite dependencies
        working-directory: tests/contract
        run: npm ci

      - name: Run contract suite
        working-directory: tests/contract
        env:
          BASE_URL: http://localhost:${{ matrix.port }}
        run: npx vitest run
