name: Deploy api-python to Azure

on:
  push:
    branches: [main]
    paths:
      - 'api-python/**'
      - '.github/workflows/deploy-api-python.yml'
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: regex-tester-api-python
  PYTHON_VERSION: '3.13'

jobs:
  # Gate: the full three-engine contract suite must pass for this exact commit before anything is
  # deployed. No secrets are passed — the suite needs none, and the Azure credentials must not be
  # exposed to it.
  test:
    uses: ./.github/workflows/contract-tests.yml

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-python

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: api-python/requirements.txt

      - name: Create deployment package
        # Oryx-free layout: Azure App Service's Python image looks for dependencies under
        # .python_packages/lib/site-packages next to the app code, so pip-install straight into
        # that folder instead of relying on Oryx's build-time `pip install -r requirements.txt`.
        run: |
          mkdir -p ../deploy
          cp -r src requirements.txt ../deploy/
          pip install --target ../deploy/.python_packages/lib/site-packages -r requirements.txt

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: deploy
          # Set here rather than via a separate azure/CLI@v2 step, which was the only thing in this
          # repo needing the AZURE_RESOURCE_GROUP secret — an unset secret expanded to nothing and
          # broke the deploy with "argument --resource-group/-g: expected one argument". This keeps
          # the workflow structurally identical to deploy-api-dotnet and deploy-api-nodejs.
          # $PORT is passed through literally for App Service to expand at runtime; no shell is
          # involved here, so it needs no escaping.
          startup-command: 'python -m uvicorn src.main:app --host 0.0.0.0 --port $PORT'
