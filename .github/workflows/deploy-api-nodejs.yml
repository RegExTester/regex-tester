name: Deploy api-nodejs to Azure

on:
  push:
    branches: [main]
    paths:
      - 'api-nodejs/**'
      - '.github/workflows/deploy-api-nodejs.yml'
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: regex-tester-api-nodejs
  NODE_VERSION: '22.x'

jobs:
  # Gate: the full three-engine contract suite must pass for this exact commit before anything is
  # deployed. No secrets are passed — the suite needs none, and the Azure credentials must not be
  # exposed to it.
  test:
    uses: ./.github/workflows/contract-tests.yml

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-nodejs

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: api-nodejs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create deployment package
        run: |
          mkdir -p ../deploy
          cp -r src package.json package-lock.json ../deploy/
          cd ../deploy && npm ci --omit=dev

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: deploy
