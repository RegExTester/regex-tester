<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Regular Expression Tester</title>
  <script>
    // GitHub Pages SPA redirect hack.
    // When GitHub Pages serves a 404 for a deep link (e.g. /abc/def/123),
    // this page redirects to the root with the original path encoded in a
    // query parameter. The main app then restores the route on load.
    // See: https://github.com/rafgraph/spa-github-pages
    var pathSegmentsToKeep = 0;
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
</body>
</html>
